<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Set Theory — The Film</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d0f2e;--ink:#f3f0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1c1e55,var(--bg) 70%);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%}
#cap{position:absolute;left:5vw;right:5vw;bottom:84px;text-align:center;font-weight:600;font-size:clamp(17px,3vw,30px);line-height:1.3;text-shadow:0 2px 18px #0d0f2e}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:14px;align-items:center;padding:14px 18px}
button{background:rgba(243,240,255,.14);color:var(--ink);border:0;border-radius:999px;padding:8px 20px;font:inherit;font-weight:600;cursor:pointer;min-width:84px}
button:hover{background:rgba(243,240,255,.24)}
button:focus-visible,#tr:focus-visible{outline:2px solid #ffd166;outline-offset:3px}
#tr{flex:1;height:10px;border-radius:9px;background:rgba(243,240,255,.14);cursor:pointer;overflow:hidden}
#fl{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6b57,#ffd166,#2ee6c5)}
</style></head><body>
<canvas id="c"></canvas>
<div id="cap" aria-live="polite"></div>
<div id="bar"><button id="b">Pause</button><div id="tr" tabindex="0" role="slider" aria-label="Progress"><i id="fl"></i></div></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),cap=document.getElementById('cap'),bt=document.getElementById('b'),tr=document.getElementById('tr'),fl=document.getElementById('fl');
const cA='255,107,87',cB='46,230,197',cG='255,209,102',cW='243,240,255',FF="'Bricolage Grotesque',system-ui,sans-serif";
let sw,sh,U,dpr;
function rs(){dpr=window.devicePixelRatio||1;sw=innerWidth;sh=innerHeight;cv.width=sw*dpr;cv.height=sh*dpr;U=Math.min(sw/100,sh/75)}
addEventListener('resize',rs);rs();
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ez=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2},seg=(t,a,b)=>ez((t-a)/(b-a)),w=(t,a,b)=>seg(t,a,a+.5)*(1-seg(t,b-.5,b)),rg=(c,a)=>`rgba(${c},${a})`;
const C=(a,b,r,f,s,l=.4)=>{x.beginPath();x.arc(a,b,Math.max(r,0),0,7);if(f){x.fillStyle=f;x.fill()}if(s){x.strokeStyle=s;x.lineWidth=l;x.stroke()}};
const tx=(s,a,b,z,col,al=1)=>{if(al<=.01)return;x.save();x.scale(1/U,1/U);x.globalAlpha=Math.min(1,al);x.fillStyle=col;x.font=`800 ${z*U}px ${FF}`;x.textAlign='center';x.textBaseline='middle';x.fillText(s,a*U,b*U);x.restore()};
const el=(n,a,b,al)=>{C(a,b,3.2,rg(cG,al));tx(n,a,b,3.6,'#0d0f2e',al)};

function s0(t){for(let i=0;i<44;i++){const an=i/44*6.283+t*.15,sx=Math.sin(i*91.7)*55,sy=Math.cos(i*53.3)*32,k=seg(t,.2+i*.04,3.6),gx=Math.cos(an)*27,gy=Math.sin(an)*27;C(sx+(gx-sx)*k,sy+(gy-sy)*k,1+k*.7,rg(i%2?cA:cB,.9))}
tx('Set Theory',0,-2,8,rg(cW,1),seg(t,3,4.4));tx('Théorie des ensembles',0,6,3.4,rg(cG,1),seg(t,4.5,5.8))}

function s1(t){const k=seg(t,.3,2);C(0,0,21*k,rg(cA,.13),rg(cA,.9),.5);tx('A',-16,-15,5,rg(cA,1),k);
[[2,-8,-5],[4,6,-8],[6,0,8]].forEach(([n,a,b],i)=>{const q=seg(t,2+i*.7,3.4+i*.7);el(n,-50+(a+50)*q,b,q)});
const q7=seg(t,5.4,6.6);el(7,60+(32-60)*q7,6,q7);
const h4=w(t,6.5,8.3),h7=w(t,8.3,10.5);C(6,-8,5,0,rg(cG,h4),.5);C(32,6,5,0,rg(cA,h7),.5);
tx('A = { 2, 4, 6 }',0,-28,5,rg(cW,1),w(t,4.2,6.5));tx('4 ∈ A',0,-28,6,rg(cG,1),h4);tx('7 ∉ A',0,-28,6,rg(cA,1),h7)}

function s2(t){C(0,0,25*seg(t,.3,1.8),rg(cB,.1),rg(cB,.9),.5);C(0,0,14*seg(t,1.8,3.2),rg(cA,.14),rg(cA,.95),.5);
tx('B',18,-21,5,rg(cB,1),seg(t,1,2));tx('A',-11,-11,4.5,rg(cA,1),seg(t,2.2,3.2));
[[1,-20,8],[2,-8,-4],[3,18,10],[4,6,-7],[5,-4,-20],[6,0,7]].forEach(([n,a,b],i)=>el(n,a,b,seg(t,2.8+i*.25,3.6+i*.25)));
const p=w(t,6,9);C(0,0,14.6,0,rg(cG,p),.7);tx('A ⊂ B',0,-29.5,6,rg(cG,1),p)}

function s3(t){const d=34-20*seg(t,1,4),a=-d/2,b=d/2,k=seg(t,.2,1);
C(a,0,16*k,rg(cA,.2),rg(cA,.95),.5);C(b,0,16*k,rg(cB,.2),rg(cB,.95),.5);
tx('A',a-8,0,5,rg(cA,1),k);tx('B',b+8,0,5,rg(cB,1),k);
const u=w(t,4.2,7.6),iw=w(t,7.8,11.8);
if(u>0){C(a,0,16,rg(cG,.5*u));C(b,0,16,rg(cG,.5*u))}
if(iw>0){x.save();x.beginPath();x.arc(a,0,16,0,7);x.clip();C(b,0,16,rg(cG,.85*iw));x.restore()}
tx('A ∪ B',0,-23,5.5,rg(cG,1),u);tx('A ∩ B',0,-23,5.5,rg(cG,1),iw)}

function s4(t){x.strokeStyle=rg(cW,.35);x.lineWidth=.4;x.strokeRect(-36,-23,72,46);tx('U',-33,-19.5,4,rg(cW,.7));
const p1=w(t,.2,5.6),p2=w(t,5.2,10);
if(p1>0){C(-6,0,14,0,rg(cA,.9*p1),.5);C(7,0,14,0,rg(cB,.9*p1),.5);
x.save();x.beginPath();x.rect(-60,-40,120,80);x.moveTo(21,0);x.arc(7,0,14,0,7);x.clip('evenodd');x.beginPath();x.arc(-6,0,14,0,7);x.clip();x.fillStyle=rg(cA,.6*p1);x.fillRect(-60,-40,120,80);x.restore();
tx('A',-13,0,4.5,rg(cW,1),p1);tx('B',14,0,4.5,rg(cW,1),p1);tx('A ∖ B',0,-27.5,5,rg(cG,1),p1)}
if(p2>0){x.save();x.beginPath();x.rect(-36,-23,72,46);x.moveTo(14,0);x.arc(0,0,14,0,7);x.clip('evenodd');x.fillStyle=rg(cB,.35*p2);x.fillRect(-40,-30,80,60);x.restore();
C(0,0,14,0,rg(cA,.95*p2),.5);tx('A',0,0,5,rg(cW,1),p2);tx('A′ = U ∖ A',0,-27.5,5,rg(cG,1),p2)}}

function s5(t){const h=(s,a)=>tx(s,0,-24,5,rg(cG,1),a);
h('A = { a, b, c }',w(t,.3,2.3));h('|A| = 3',w(t,2.3,4.6));h('Power set  P(A)',seg(t,4.4,5.2));
const ad=w(t,.5,4.6);[['a',-12,5],['b',12,5],['c',0,-10]].forEach(([n,a,b])=>{C(a,b,4.2,rg(cG,ad));tx(n,a,b,4.6,'#0d0f2e',ad)});
const P=[[-3.4,2.2],[3.4,2.2],[0,-3.8]];
for(let k=0;k<8;k++){const q=seg(t,4.6+k*.45,5.4+k*.45),X=((k%4)-1.5)*17,Y=(k>3?1:-1)*8.5;
C(X,Y,7.5*q,rg(cB,.08*q),rg(cB,.7*q),.35);
if(k)P.forEach((p,j)=>C(X+p[0],Y+p[1],1.6*q,rg(cG,(k>>j&1)?q:.18*q)));else tx('∅',X,Y,5,rg(cW,.9),q)}
tx('2 × 2 × 2 = 2³ = 8',0,24,4.6,rg(cG,1),seg(t,9.5,10.5))}

function s6(t){const R=[6,13,20,27],cs=[cG,cA,cB,cW],L=['ℕ','ℤ','ℚ','ℝ'],dim=1-.65*seg(t,7.4,8.2);
for(let i=3;i>=0;i--){const k=seg(t,.4+i*1.6,1.6+i*1.6);C(0,0,R[i]*k,rg(cs[i],.1*dim),rg(cs[i],.9*dim),.45);tx(L[i],0,i?-R[i]+3.3:0,4.4,rg(cs[i],1),k*dim)}
tx('|ℕ| < |ℝ|',0,-3,8,rg(cG,1),seg(t,7.8,8.8));tx('some infinities are bigger than others',0,5,3.2,rg(cW,1),seg(t,8.6,9.6))}

function s7(t){['∈','⊂','∪','∩','∖','∅','∞','ℝ'].forEach((s,i)=>{const an=i/8*6.283+t*.35,a=seg(t,.2+i*.12,1.2+i*.12);tx(s,Math.cos(an)*24,Math.sin(an)*24,7,rg([cG,cA,cB][i%3],1),a)});
tx('Sets',0,-2,12,rg(cW,1),seg(t,.8,1.8));tx('the foundation of math',0,7,3.4,rg(cG,1),seg(t,1.8,2.8))}

const D=[8,10.5,9,12,10,12,11,7],F=[s0,s1,s2,s3,s4,s5,s6,s7],TOT=D.reduce((a,b)=>a+b);
const CP=[
[[0,'Mathematics needs a place to start.'],[3.2,'It starts with sets — ensembles.'],[5.8,"Let's see how they work."]],
[[0,'A set is a collection of distinct objects.'],[4,'Write them inside braces: A = {2, 4, 6}.'],[6.5,'4 belongs to A — we write 4 ∈ A.'],[8.4,'7 does not — we write 7 ∉ A.']],
[[0,'Now put one set inside another.'],[3.5,'Every element of A is also in B.'],[6,'So A is a subset of B: A ⊂ B.']],
[[0,'Take two sets, A and B, and slide them together.'],[4.2,'The union A ∪ B: everything in A or in B.'],[7.8,'The intersection A ∩ B: only what they share.']],
[[0,'The difference A ∖ B: what is in A but not in B.'],[5.4,'The complement A′: everything in U outside A.']],
[[0,'A set with three elements has cardinality 3.'],[4.4,'Now list every subset — even the empty one, ∅.'],[9.5,'Each element is in or out: 2 × 2 × 2 = 8 subsets.']],
[[0,'Numbers form nested sets: ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ.'],[7.6,'Infinite sets can differ in size — Cantor proved |ℕ| < |ℝ|.']],
[[0,'Sets are the foundation of mathematics.'],[3.5,'Everything else is built from them.']]];
let T=0,pl=true,L=performance.now(),key='';
function sync(){bt.textContent=T>=TOT?'Replay':pl?'Pause':'Play'}
bt.onclick=()=>{if(T>=TOT){T=0;pl=true}else pl=!pl;sync()};
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();bt.click()}});
tr.onclick=e=>{const r=tr.getBoundingClientRect();T=cl((e.clientX-r.left)/r.width)*TOT*.999;pl=true;sync()};
function loop(n){const dt=Math.min(.1,(n-L)/1000);L=n;
if(pl){T=Math.min(TOT,T+dt);if(T>=TOT){pl=false;sync()}}
let i=0,s=0;while(i<7&&T>=s+D[i]){s+=D[i];i++}const t=T-s;
x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,sw,sh);
for(let j=0;j<50;j++){x.fillStyle=`rgba(${cW},.13)`;x.beginPath();x.arc(sw*(.5+.5*Math.sin(j*7.3+n*.00004*(1+j%3*.3)*20)),sh*(.5+.5*Math.sin(j*3.1+n*.000055*20)),1+j%3,0,7);x.fill()}
x.translate(sw/2,sh*.42);x.scale(U,U);F[i](t);x.setTransform(1,0,0,1,0,0);
let c=CP[i][0];for(const q of CP[i])if(q[0]<=t)c=q;const k=i+c[1];
if(k!==key){key=k;cap.textContent=c[1];cap.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:600,easing:'ease-out'})}
fl.style.width=T/TOT*100+'%';requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
