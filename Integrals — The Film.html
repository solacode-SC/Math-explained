<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Integrals — The Film</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d0f2e;--ink:#f3f0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1c1e55,var(--bg) 70%);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%}
#cap{position:absolute;left:5vw;right:5vw;bottom:84px;text-align:center;font-weight:600;font-size:clamp(17px,3vw,30px);line-height:1.3;text-shadow:0 2px 18px #0d0f2e}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:14px;align-items:center;padding:14px 18px}
button{background:rgba(243,240,255,.14);color:var(--ink);border:0;border-radius:999px;padding:8px 20px;font:inherit;font-weight:600;cursor:pointer;min-width:84px}
button:hover{background:rgba(243,240,255,.24)}
button:focus-visible,#tr:focus-visible{outline:2px solid #ffd166;outline-offset:3px}
#tr{flex:1;height:10px;border-radius:9px;background:rgba(243,240,255,.14);cursor:pointer;overflow:hidden}
#fl{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6b57,#ffd166,#2ee6c5)}
</style></head><body>
<canvas id="c"></canvas>
<div id="cap" aria-live="polite"></div>
<div id="bar"><button id="b">Pause</button><div id="tr" tabindex="0" role="slider" aria-label="Progress"><i id="fl"></i></div></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),cap=document.getElementById('cap'),bt=document.getElementById('b'),tr=document.getElementById('tr'),fl=document.getElementById('fl');
const cA='255,107,87',cB='46,230,197',cG='255,209,102',cW='243,240,255',FF="'Bricolage Grotesque',system-ui,sans-serif";
let sw,sh,U,dpr;
function rs(){dpr=window.devicePixelRatio||1;sw=innerWidth;sh=innerHeight;cv.width=sw*dpr;cv.height=sh*dpr;U=Math.min(sw/100,sh/75)}
addEventListener('resize',rs);rs();
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ez=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2},seg=(t,a,b)=>ez((t-a)/(b-a)),w=(t,a,b)=>seg(t,a,a+.5)*(1-seg(t,b-.5,b)),rg=(c,a)=>`rgba(${c},${a})`;
const C=(a,b,r,f,s,l=.4)=>{x.beginPath();x.arc(a,b,Math.max(r,0),0,7);if(f){x.fillStyle=f;x.fill()}if(s){x.strokeStyle=s;x.lineWidth=l;x.stroke()}};
const ln=(a,b,c,d,col,l=.5)=>{x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.strokeStyle=col;x.lineWidth=l;x.stroke()};
const tx=(s,a,b,z,col,al=1)=>{if(al<=.01)return;x.save();x.scale(1/U,1/U);x.globalAlpha=Math.min(1,al);x.fillStyle=col;x.font=`800 ${z*U}px ${FF}`;x.textAlign='center';x.textBaseline='middle';x.fillText(s,a*U,b*U);x.restore()};
const dash=(f)=>{x.setLineDash([1,1]);f();x.setLineDash([])};

// Graph coordinate mapping: x from 0 to 2 mapped to screen x: -16 to +16 (width 32)
// f(x) = x^2, so y goes from 0 to 4. Mapped to screen y: 16 (y=0) to -16 (y=4, height 32)
const toScrX=u=>-16+u*16;
const toScrY=v=>16-v*8;

function drawAxes(al=1){
  dash(()=>{
    ln(-30,16,30,16,rg(cW,.3*al),.3);
    ln(-16,-22,-16,20,rg(cW,.3*al),.3);
  });
  tx('0',-16,18.5,2.6,rg(cW,.7),al);
  tx('1',0,18.5,2.6,rg(cW,.7),al);
  tx('2',16,18.5,2.6,rg(cW,.7),al);
  tx('4',-18.5,-16,2.6,rg(cW,.7),al);
}

function drawCurve(al=1){
  x.beginPath();
  for(let u=0;u<=2.2;u+=.02){
    const sx=toScrX(u),sy=toScrY(u*u);
    if(u===0)x.moveTo(sx,sy);else x.lineTo(sx,sy);
  }
  x.strokeStyle=rg(cW,.85*al);x.lineWidth=.7;x.stroke();
  tx('f(x) = x²',20,-20,3.5,rg(cW,1),al);
}

function s0(t){
  // Title scene: shimmering Riemann slices building up
  const k=seg(t,.2,2.5);
  for(let i=0;i<16;i++){
    const u=i/16*2,wPix=2/16*16,hVal=u*u;
    const sx=toScrX(u),sy=toScrY(hVal);
    const gr=Math.sin(t*2+i*.3)*.5+.5;
    x.fillStyle=rg(cB,.15+.1*gr);
    x.fillRect(sx,sy,wPix,16-sy);
    x.strokeStyle=rg(cG,.4);x.lineWidth=.3;
    x.strokeRect(sx,sy,wPix,16-sy);
  }
  drawCurve(k);
  tx('Integrals',0,-12,7.5,rg(cW,1),seg(t,1.8,3));
  tx('Riemann rectangles becoming an area',0,-5,3.6,rg(cG,1),seg(t,3,4.2));
  tx('the architecture of continuous accumulation',0,1,3,rg(cB,1),seg(t,4.2,5.4));
}

function s1(t){
  // The Area Dilemma
  const k=seg(t,.2,1.2);
  drawAxes(k);
  drawCurve(k);

  // Shaded target curved area
  const fillA=seg(t,2,3.8);
  if(fillA>0){
    x.save();
    x.beginPath();
    x.moveTo(toScrX(0),toScrY(0));
    for(let u=0;u<=2;u+=.02)x.lineTo(toScrX(u),toScrY(u*u));
    x.lineTo(toScrX(2),toScrY(0));
    x.closePath();
    x.fillStyle=rg(cG,.25*fillA);
    x.fill();
    x.restore();
    tx('Target: Area under f(x) = x²',0,-7,3.6,rg(cG,1),fillA);
    tx('From x = 0 to x = 2',0,-2,3.2,rg(cW,.9),fillA);
  }
  tx('Straight boundaries are easy: Area = Width × Height',0,-24,3.8,rg(cW,1),w(t,.5,4.5));
  tx('Curves change constantly: How do we measure them?',0,-24,3.8,rg(cA,1),seg(t,4.6,6));
}

function s2(t){
  // 4 Riemann rectangles
  const k=seg(t,.2,1);
  drawAxes(k);
  drawCurve(k);

  const n=4,dx=2/n;
  const rise=seg(t,1.2,3.2);

  let sum=0;
  for(let i=1;i<=n;i++){
    const u=i*dx;
    const hVal=u*u;
    sum+=hVal*dx;
    const sx=toScrX(u-dx),wPix=dx*16;
    const sy=toScrY(hVal*rise);
    x.fillStyle=rg(cA,.22);
    x.fillRect(sx,sy,wPix,16-sy);
    x.strokeStyle=rg(cA,.85);x.lineWidth=.5;
    x.strokeRect(sx,sy,wPix,16-sy);
    C(toScrX(u),toScrY(hVal),1.3,rg(cG,rise));
  }

  // Display rectangles and overshoot
  tx('4 Rectangles (Right Riemann Sum)',0,-24,4.2,rg(cA,1),k);
  
  // HUD
  x.fillStyle=rg('13,15,46',.85);x.strokeStyle=rg(cA,.8);x.lineWidth=.4;
  x.fillRect(18,-15,28,19);x.strokeRect(18,-15,28,19);
  tx(`n = 4 rectangles`,32,-11,2.8,rg(cW,1));
  tx(`Width Δx = 0.50`,32,-6.5,2.8,rg(cB,1));
  tx(`Area ≈ ${sum.toFixed(3)}`,32,-2,3.3,rg(cG,1));
  tx(`Exact = 8/3 ≈ 2.667`,32,2.5,2.5,rg(cW,.8));
  tx(`Large overshot gaps!`,0,22,3.4,rg(cA,1),seg(t,4.5,6));
}

function s3(t){
  // Gradual increase: 4 -> 10 -> 50 -> 200
  const k=seg(t,.2,.8);
  drawAxes(k);
  drawCurve(k);

  // Time milestones for n:
  // 0-3.5s: n=4
  // 3.5-7s: n=10
  // 7-11.5s: n=50
  // 11.5-16s: n=200
  let n=4;
  if(t>=11.5) n=200;
  else if(t>=7) n=50;
  else if(t>=3.5) n=10;

  const dx=2/n;
  let sum=0;
  for(let i=1;i<=n;i++){
    const u=i*dx;
    const hVal=u*u;
    sum+=hVal*dx;
    const sx=toScrX(u-dx),wPix=dx*16;
    const sy=toScrY(hVal);
    x.fillStyle=n>=50?rg(cB,.35):rg(cG,.25);
    x.fillRect(sx,sy,wPix,16-sy);
    if(n<=50){
      x.strokeStyle=rg(cG,.5);x.lineWidth=.25;
      x.strokeRect(sx,sy,wPix,16-sy);
    }
  }

  // Live HUD
  const err=Math.abs(sum-8/3);
  x.fillStyle=rg('13,15,46',.88);x.strokeStyle=rg(n===200?cB:cG,.8);x.lineWidth=.4;
  x.fillRect(18,-18,30,24);x.strokeRect(18,-18,30,24);
  
  tx('REFINING THE MESH',33,-14,2.4,rg(cW,.7));
  tx(`Rectangles: n = ${n}`,33,-9.5,3.1,rg(cG,1));
  tx(`Slice Width Δx = ${dx.toFixed(3)}`,33,-5,2.7,rg(cB,1));
  tx(`Riemann Sum = ${sum.toFixed(3)}`,33,0,3.3,rg(cW,1));
  tx(`Exact Value = 2.667`,33,4.5,2.6,rg(cG,1));
  tx(`Error = ${err.toFixed(3)}`,33,8,2.7,err<.03?rg(cB,1):rg(cA,1));

  tx(`n = ${n} rectangles: gaps shrink away`,0,-24,4.2,rg(n===200?cB:cG,1),k);
}

function s4(t){
  // The Definite Integral Formula
  const k=seg(t,.2,1);
  drawAxes(k);
  drawCurve(k);

  // Exact integral filled smooth region
  x.save();
  x.beginPath();
  x.moveTo(toScrX(0),toScrY(0));
  for(let u=0;u<=2;u+=.02)x.lineTo(toScrX(u),toScrY(u*u));
  x.lineTo(toScrX(2),toScrY(0));
  x.closePath();
  const grad=x.createLinearGradient(0,16,0,-16);
  grad.addColorStop(0,rg(cB,.4));
  grad.addColorStop(1,rg(cG,.55));
  x.fillStyle=grad;
  x.fill();
  x.restore();

  // Highlight exact integral formula
  tx('The Definite Integral',0,-24,4.6,rg(cG,1),k);
  tx('∫₀² x² dx  =  [ x³ / 3 ]₀²',-2,-17,4,rg(cW,1),seg(t,1.5,2.6));
  tx('=  (2³ / 3) − 0  =  8/3',-2,-11,4.2,rg(cB,1),seg(t,3,4.2));
  tx('Exact Area = 2.6666... ≈ 2.667',-2,-5,4.6,rg(cG,1),seg(t,4.6,5.8));
  tx('The integral ∫ is an elongated S — for Summa!',0,22,3.3,rg(cW,.9),seg(t,6,7.5));
}

function s5(t){
  // Accumulation Function & The Fundamental Theorem of Calculus
  const k=seg(t,.2,1);
  drawAxes(k);
  drawCurve(k);

  // Scanning bar at x_t
  const pos=seg(t,1.2,7)*2;
  const sxScan=toScrX(pos);

  // Shaded region up to pos
  x.save();
  x.beginPath();
  x.moveTo(toScrX(0),toScrY(0));
  for(let u=0;u<=pos;u+=.02)x.lineTo(toScrX(u),toScrY(u*u));
  x.lineTo(sxScan,toScrY(0));
  x.closePath();
  x.fillStyle=rg(cB,.35);
  x.fill();
  x.restore();

  // Scanner needle
  ln(sxScan,16,sxScan,toScrY(pos*pos),rg(cG,1),1.1);
  C(sxScan,toScrY(pos*pos),1.5,rg(cG,1));

  const curArea=(pos*pos*pos/3).toFixed(3);
  tx('Accumulation Function:  A(x) = ∫₀ˣ f(t) dt',0,-24,4.2,rg(cG,1),k);
  tx(`x = ${pos.toFixed(2)}    Accumulated Area A(x) = ${curArea}`,0,-16,3.6,rg(cW,1),k);
  tx('The Fundamental Theorem of Calculus',0,20,3.8,rg(cB,1),seg(t,4,5.5));
  tx('Rate of Area Growth = Height of Curve:  A′(x) = f(x)',0,25,3.2,rg(cG,1),seg(t,5.5,7));
}

function s6(t){
  // Finale
  for(let i=0;i<30;i++){
    const ph=(t*.4+i/30)%1;
    const sx=-35+ph*70,sy=12-14*Math.sin(ph*3.1415);
    ln(sx,16,sx,sy,rg(i%2?cB:cG,.25),.8);
  }
  C(0,0,1,rg(cG,1));
  tx('Integrals',0,-6,10,rg(cW,1),seg(t,.5,1.5));
  tx('from infinite thin slices emerges exact area',0,4,3.6,rg(cB,1),seg(t,1.5,2.5));
}

const D=[6.5,9,11,16,11,10,7],F=[s0,s1,s2,s3,s4,s5,s6],TOT=D.reduce((a,b)=>a+b),N=D.length-1;
const CP=[
[[0,'How do you measure area when the boundary never stays flat?'],[3,'Integration is the mathematics of continuous accumulation.']],
[[0,'A rectangle has a simple area: width times height.'],[3,'A curved shape defies simple multiplication.'],[5.5,'The solution: chop it into thin vertical rectangles.']],
[[0,'Start with 4 rectangles under f(x) = x² from 0 to 2.'],[2.5,'Width Δx = 0.5. Notice the jagged tops overhanging the curve.'],[6.5,'Their total area is 3.75 — an overestimate.']],
[[0,'Now increase the number of slices: 10, then 50, then 200.'],[3.5,'At n = 10, the area drops to 3.080.'],[7.5,'At n = 50, it reaches 2.747.'],[11.5,'At n = 200, the jagged steps vanish: area ≈ 2.687!']],
[[0,'In the limit as n → ∞, Riemann sum becomes the definite integral.'],[3,'∫₀² x² dx = [x³/3]₀² = 8/3 ≈ 2.667.'],[6.5,'The symbol ∫ is Leibniz’s elongated "S" for Sum.']],
[[0,'Integration accumulates total quantity over time or space.'],[3.5,'The derivative and integral are inverse mirrors of each other.'],[6.8,'The rate of area growth is exactly the height of the curve.']],
[[0,'From infinite thin slices emerges exact truth.'],[3,'That is the power of the integral.']]];

let T=0,pl=true,L=performance.now(),key='';
function sync(){bt.textContent=T>=TOT?'Replay':pl?'Pause':'Play'}
bt.onclick=()=>{if(T>=TOT){T=0;pl=true}else pl=!pl;sync()};
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();bt.click()}});
tr.onclick=e=>{const r=tr.getBoundingClientRect();T=cl((e.clientX-r.left)/r.width)*TOT*.999;pl=true;sync()};
function loop(n){const dt=Math.min(.1,(n-L)/1000);L=n;
if(pl){T=Math.min(TOT,T+dt);if(T>=TOT){pl=false;sync()}}
let i=0,s=0;while(i<N&&T>=s+D[i]){s+=D[i];i++}const t=T-s;
x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,sw,sh);
for(let j=0;j<50;j++){x.fillStyle=`rgba(${cW},.13)`;x.beginPath();x.arc(sw*(.5+.5*Math.sin(j*7.3+n*.0008*(1+j%3*.3))),sh*(.5+.5*Math.sin(j*3.1+n*.0011)),1+j%3,0,7);x.fill()}
x.translate(sw/2,sh*.42);x.scale(U,U);F[i](t);x.setTransform(1,0,0,1,0,0);
let c=CP[i][0];for(const q of CP[i])if(q[0]<=t)c=q;const k=i+c[1];
if(k!==key){key=k;cap.textContent=c[1];cap.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:600,easing:'ease-out'})}
fl.style.width=T/TOT*100+'%';requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
